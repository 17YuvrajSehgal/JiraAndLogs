  <text x="1165" y="530" font-size="12" font-weight="bold" font-family="monospace" fill="#2F3A4A">callers_of</text>
  <text x="1165" y="547" font-size="12" fill="#555">one hop back</text>
  <rect x="1267" y="518" width="46" height="21" rx="10.5" fill="#4B5563"/>
  <text x="1290" y="533" font-size="12" font-weight="bold" fill="#FFF" text-anchor="middle">0.01</text>

  <rect x="790" y="568" width="534" height="52" rx="8" fill="#FFF8E4" stroke="#D9A520" stroke-width="2"/>
  <text x="802" y="590" font-size="14.5" font-weight="bold" fill="#8A6A10">KEY: the file a trace names is rarely the file at fault.</text>
  <text x="802" y="610" font-size="14" fill="#555">73% of a plain model's misses are choosing wrongly, not searching wrongly.</text>

  <!-- the loop -->
  <path d="M786,533 C756,533 756,263 786,263" fill="none" stroke="#4B5563" stroke-width="2.6" stroke-dasharray="9 6" marker-end="url(#m-gray)"/>
  <text x="762" y="404" font-size="13" font-weight="bold" fill="#2F3A4A" text-anchor="middle" transform="rotate(-90 762 404)">read result, choose next tool</text>


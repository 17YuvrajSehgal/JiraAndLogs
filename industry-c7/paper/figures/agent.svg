  <text x="801" y="530" font-size="12" font-weight="bold" font-family="monospace" fill="#2F3A4A">list_dir</text>
  <text x="801" y="547" font-size="12" fill="#555">the file tree</text>
  <rect x="903" y="518" width="46" height="21" rx="10.5" fill="#4B5563"/>
  <text x="926" y="533" font-size="12" font-weight="bold" fill="#FFF" text-anchor="middle">0.13</text>

  <rect x="972" y="510" width="170" height="46" rx="8" fill="#F4F5F7" stroke="#4B5563" stroke-width="1.6"/>
  <text x="983" y="530" font-size="12" font-weight="bold" font-family="monospace" fill="#2F3A4A">read_skeleton</text>
  <text x="983" y="547" font-size="12" fill="#555">declarations</text>

  <text x="504" y="78" font-size="19" font-weight="bold" text-anchor="middle" fill="#222">PHASE 0 · PREPARE THE CASE</text>

  <circle cx="342" cy="122" r="13" fill="#8E6CC8"/>
  <text x="342" y="127.5" font-size="15" font-weight="bold" fill="#FFF" text-anchor="middle">1</text>
  <rect x="324" y="146" width="360" height="146" rx="10" fill="#F2EDFA" stroke="#8E6CC8" stroke-width="2"/>
  <text x="342" y="174" font-size="17" font-weight="bold" fill="#5A3E96">Restate the problem</text>
  <text x="342" y="202" font-size="14.5" fill="#555">one model call rewrites the report as</text>
  <text x="342" y="223" font-size="14.5" fill="#555">the faulty BEHAVIOUR, in the words</text>
  <text x="342" y="244" font-size="14.5" fill="#555">the code itself would use</text>
  <rect x="342" y="256" width="324" height="26" rx="6" fill="#FFF" stroke="#8E6CC8" stroke-width="1.6"/>
  <text x="352" y="274" font-size="13" font-family="monospace" fill="#5A3E96">"partition assignment returns null"</text>
  <text x="366" y="122" font-size="15.5" font-weight="bold" fill="#5A3E96">a symptom is not a search query</text>

  <circle cx="342" cy="322" r="13" fill="#4A7FC1"/>
  <text x="342" y="327.5" font-size="15" font-weight="bold" fill="#FFF" text-anchor="middle">2</text>
  <text x="366" y="322" font-size="15.5" font-weight="bold" fill="#2D5A94">hand over evidence, do not ask for it</text>
  <rect x="324" y="346" width="360" height="274" rx="10" fill="#EAF2FB" stroke="#4A7FC1" stroke-width="2"/>
  <text x="342" y="374" font-size="17" font-weight="bold" fill="#2D5A94">Seed the investigation</text>
  <text x="342" y="400" font-size="13.5" font-style="italic" fill="#2D5A94">deterministic, no model involved</text>

  <rect x="342" y="414" width="324" height="44" rx="7" fill="#FFF" stroke="#4A7FC1" stroke-width="1.6"/>
  <text x="354" y="433" font-size="14.5" font-weight="bold" fill="#2D5A94">top-20 retrieved candidates</text>
  <text x="354" y="451" font-size="13.5" fill="#555">from the lexical retrieval layer</text>

  <rect x="342" y="466" width="324" height="44" rx="7" fill="#FFF" stroke="#4A7FC1" stroke-width="1.6"/>
  <text x="354" y="485" font-size="14.5" font-weight="bold" fill="#2D5A94">symbols that exist here</text>
  <text x="354" y="503" font-size="13.5" fill="#555">trace frames, library names dropped</text>

  <rect x="342" y="518" width="324" height="44" rx="7" fill="#FFF" stroke="#4A7FC1" stroke-width="1.6"/>
  <text x="354" y="537" font-size="14.5" font-weight="bold" fill="#2D5A94">code matching the behaviour</text>
  <text x="354" y="555" font-size="13.5" fill="#555">content search, run unconditionally</text>

  <rect x="342" y="570" width="324" height="44" rx="7" fill="#FFF" stroke="#D4537E" stroke-width="1.8"/>
  <text x="354" y="589" font-size="14.5" font-weight="bold" fill="#A32C58">similar past incidents</text>
  <text x="354" y="607" font-size="13.5" fill="#555">firewalled; vote weighted by fix size</text>


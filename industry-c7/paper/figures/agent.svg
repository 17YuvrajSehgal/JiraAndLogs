  <text x="52" y="461" font-size="14.5" fill="#555">the files their fixes</text>
  <text x="52" y="482" font-size="14.5" fill="#555">touched</text>
  <text x="52" y="505" font-size="13.5" font-style="italic" fill="#A32C58">4,033 to 19,820 per project</text>

  <rect x="36" y="532" width="216" height="88" rx="10" fill="#FBECEC" stroke="#C25B5B" stroke-width="2.2"/>

  <text x="774" y="178" font-size="14.5" fill="#555">temperature 0, fixed seed · 12.2 model calls and 16.2 tool calls per issue</text>

  <text x="790" y="228" font-size="15.5" font-weight="bold" fill="#2F3A4A">EIGHT TOOLS, each a pure function of the snapshot</text>
  <text x="1324" y="228" font-size="13.5" font-style="italic" text-anchor="end" fill="#777">calls per issue</text>


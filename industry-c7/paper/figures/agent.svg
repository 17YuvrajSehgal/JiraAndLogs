  <!-- ================= PHASE 2-4 ================= -->
  <rect x="1378" y="72" width="384" height="566" rx="14" fill="#FDFDFB" stroke="#333" stroke-width="2.2" stroke-dasharray="9 6"/>
  <rect x="1396" y="56" width="348" height="32" rx="8" fill="#FFF" stroke="#333" stroke-width="2"/>
  <text x="1570" y="78" font-size="19" font-weight="bold" text-anchor="middle" fill="#222">PHASE 2-4 · COMMIT</text>

  <circle cx="1414" cy="122" r="13" fill="#E8794A"/>
  <text x="1414" y="127.5" font-size="15" font-weight="bold" fill="#FFF" text-anchor="middle">3</text>
  <text x="1438" y="122" font-size="15.5" font-weight="bold" fill="#A54B22">evidence is not optional</text>

  <rect x="1396" y="146" width="348" height="168" rx="10" fill="#FDEFE6" stroke="#E8794A" stroke-width="2"/>
  <use href="#i-check" x="1412" y="158"/>
  <text x="1458" y="182" font-size="17" font-weight="bold" fill="#A54B22">submit_ranking</text>
  <text x="1412" y="218" font-size="14.5" fill="#555">every file must carry what was</text>
  <text x="1412" y="239" font-size="14.5" fill="#555">SEEN: the symbol, the line, the</text>
  <text x="1412" y="260" font-size="14.5" fill="#555">past incident. The schema</text>
  <text x="1412" y="281" font-size="14.5" fill="#555">rejects a list without it.</text>
  <text x="1412" y="303" font-size="13.5" font-style="italic" fill="#A54B22">790 of 790 runs submitted</text>

  <rect x="1396" y="330" width="348" height="94" rx="10" fill="#F4F5F7" stroke="#4B5563" stroke-width="2"/>
  <text x="1412" y="356" font-size="16.5" font-weight="bold" fill="#2F3A4A">Backfill, never reorder</text>
  <text x="1412" y="382" font-size="14" fill="#555">short answers are padded from the</text>
  <text x="1412" y="402" font-size="14" fill="#555">retrieval layer; agent order is kept</text>

  <rect x="1396" y="440" width="348" height="180" rx="10" fill="#FFF8E4" stroke="#D9A520" stroke-width="2.4"/>
  <use href="#i-star" x="1412" y="452"/>
  <text x="1458" y="476" font-size="18" font-weight="bold" fill="#8A6A10">Ranked files + evidence</text>
  <text x="1412" y="512" font-size="16" fill="#444">Acc@5 <tspan font-weight="bold" font-size="19" fill="#8A6A10">90.3%</tspan>   Acc@1 <tspan font-weight="bold" font-size="19" fill="#8A6A10">72.3%</tspan></text>
  <text x="1412" y="544" font-size="15" fill="#444">on reports naming no faulty file:</text>
